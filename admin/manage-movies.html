
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Movies - GII MOVIES</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 25px;
            background: #080d18;
            color: white;
            font-family: Arial, sans-serif;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        h1 { color: #00d4ff; }
        a, button {
            padding: 10px 15px;
            border: 0;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
        }
        a { background: #00bde8; color: #00121b; }
        .refresh { background: #26364f; color: white; }
        .movie {
            background: #121d30;
            border: 1px solid #26364f;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .movie img {
            width: 100px;
            height: 135px;
            object-fit: cover;
            border-radius: 6px;
            background: #26364f;
        }
        .details { flex: 1; min-width: 180px; }
        .details p { color: #aebbd0; }
        .edit { background: #f0b429; color: #171000; }
        .delete { background: #e63946; color: white; }
        #message { margin-top: 20px; color: #00d4ff; }
    </style>
</head>
<body>

<header>
    <h1>GII MOVIES | Manage Movies</h1>
    <a href="index.html">Admin Dashboard</a>
</header>

<h2>All Movies</h2>
<button class="refresh" onclick="loadMovies()">REFRESH MOVIES</button>

<div id="message">Loading movies...</div>
<div id="moviesContainer"></div>

<script>
const API_URL = "https://agasobanuyerwanda.loexmegh.workers.dev";
const token = sessionStorage.getItem("adminToken");

if (!token) {
    window.location.href = "login.html";
}

async function loadMovies() {
    const container = document.getElementById("moviesContainer");
    const message = document.getElementById("message");

    container.innerHTML = "";
    message.textContent = "Loading movies...";

    try {
        const response = await fetch(API_URL + "/api/movies");
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to load movies.");
        }

        const movies = data.movies || [];

        if (movies.length === 0) {
            message.textContent = "No movies found.";
            return;
        }

        message.textContent = movies.length + " movie(s) found.";

        movies.forEach(movie => {
            const card = document.createElement("div");
            card.className = "movie";

            const image = document.createElement("img");
            image.src = movie.poster_url || "";
            image.alt = movie.title;
            image.onerror = () => image.style.display = "none";

            const details = document.createElement("div");
            details.className = "details";

            const title = document.createElement("h3");
            title.textContent = movie.title;

            const year = document.createElement("p");
            year.textContent = "Year: " + (movie.release_year || "N/A");

            const category = document.createElement("p");
            category.textContent = "Category: " + (movie.category_name || "N/A");

            const id = document.createElement("p");
            id.textContent = "Movie ID: " + movie.movie_id;

            const edit = document.createElement("button");
            edit.className = "edit";
            edit.textContent = "EDIT";
            edit.onclick = () => {
                window.location.href = "edit-movie.html?id=" +
                    encodeURIComponent(movie.movie_id);
            };

            const remove = document.createElement("button");
            remove.className = "delete";
            remove.textContent = "DELETE";
            remove.onclick = () => deleteMovie(movie.movie_id, movie.title);

            details.append(title, year, category, id, edit, remove);
            card.append(image, details);
            container.appendChild(card);
        });

    } catch (error) {
        message.textContent = error.message;
    }
}

async function deleteMovie(id, title) {
    if (!confirm("Are you sure you want to delete " + title + "?")) {
        return;
    }

    const message = document.getElementById("message");

    try {
        const response = await fetch(API_URL + "/api/movies/" + id, {
            method: "DELETE",
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Could not delete movie.");
        }

        message.textContent = "Movie deleted successfully!";
        loadMovies();

    } catch (error) {
        message.textContent = error.message;
    }
}

loadMovies();
</script>

</body>
</html>
