
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Movies | GII MOVIES</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .manage-container {
            padding: 35px 5%;
        }

        .add-button {
            display: inline-block;
            padding: 12px 20px;
            background: #e50914;
            border-radius: 5px;
            margin: 20px 0;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #191919;
            min-width: 600px;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #333;
            text-align: left;
        }

        th {
            background: #292929;
            color: #e50914;
        }

        .delete-button {
            background: #e50914;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        #message {
            margin: 15px 0;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">GII MOVIES ADMIN</div>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="../index.html">Website</a>
    </nav>
</header>

<main class="manage-container">

    <h1>Manage Movies</h1>

    <a href="add-movie.html" class="add-button">+ Add New Movie</a>

    <p id="message">Loading movies...</p>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Movie Title</th>
                    <th>Category</th>
                    <th>Year</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="movieTable"></tbody>
        </table>
    </div>

</main>

<footer>
    <p>© 2026 GII MOVIES Admin Panel</p>
</footer>

<script>
const API_URL = "https://agasobanuyerwanda.loexmegh.workers.dev";
const token = sessionStorage.getItem("adminToken");

if (!token) {
    window.location.href = "login.html";
}

// LOAD MOVIES FROM DATABASE
async function loadMovies() {
    const table = document.getElementById("movieTable");
    const message = document.getElementById("message");

    try {
        const response = await fetch(API_URL + "/api/movies");
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error("Unable to load movies.");
        }

        table.innerHTML = "";

        if (data.movies.length === 0) {
            message.textContent = "No movies available.";
            return;
        }

        message.textContent = "";

        data.movies.forEach(movie => {
            const row = document.createElement("tr");

            const title = document.createElement("td");
            title.textContent = movie.title;

            const category = document.createElement("td");
            category.textContent = movie.category_name || "Unknown";

            const year = document.createElement("td");
            year.textContent = movie.release_year || "";

            const action = document.createElement("td");

            const button = document.createElement("button");
            button.textContent = "Delete";
            button.className = "delete-button";
            button.onclick = () => deleteMovie(movie.movie_id);

            action.appendChild(button);
            row.append(title, category, year, action);
            table.appendChild(row);
        });

    } catch (error) {
        message.textContent = error.message;
    }
}

// DELETE MOVIE FROM DATABASE
async function deleteMovie(id) {
    const confirmation = confirm(
        "Are you sure you want to delete this movie?"
    );

    if (!confirmation) return;

    const message = document.getElementById("message");

    try {
        const response = await fetch(API_URL + "/api/movies/" + id, {
            method: "DELETE",
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Delete failed.");
        }

        message.textContent = "Movie deleted successfully!";
        loadMovies();

    } catch (error) {
        message.textContent = error.message;
    }
}

loadMovies();
</script>

</body>
</html>
