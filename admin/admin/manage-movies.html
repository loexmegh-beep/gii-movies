
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Movies | GII MOVIES</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .manage-container {
            padding: 35px 5%;
        }

        .manage-container h1 {
            margin-bottom: 20px;
        }

        .add-button {
            display: inline-block;
            padding: 12px 20px;
            background: #e50914;
            border-radius: 5px;
            margin-bottom: 25px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #191919;
            min-width: 600px;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #333;
            text-align: left;
        }

        th {
            background: #292929;
            color: #e50914;
        }

        .delete-button {
            background: #e50914;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">GII MOVIES ADMIN</div>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="../index.html">Website</a>
    </nav>
</header>

<main class="manage-container">

    <h1>Manage Movies</h1>

    <a href="add-movie.html" class="add-button">+ Add New Movie</a>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Movie Title</th>
                    <th>Category</th>
                    <th>Year</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="movieTable">
                <tr>
                    <td>Dark World</td>
                    <td>Action</td>
                    <td>2026</td>
                    <td>
                        <button class="delete-button" onclick="deleteMovie(this)">
                            Delete
                        </button>
                    </td>
                </tr>

                <tr>
                    <td>Lost Kingdom</td>
                    <td>Adventure</td>
                    <td>2026</td>
                    <td>
                        <button class="delete-button" onclick="deleteMovie(this)">
                            Delete
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</main>

<footer>
    <p>© 2026 GII MOVIES Admin Panel</p>
</footer>

<script>
function deleteMovie(button) {
    const confirmation = confirm("Are you sure you want to delete this movie?");

    if (confirmation) {
        button.closest("tr").remove();
    }
}
</script>

</body>
</html>
