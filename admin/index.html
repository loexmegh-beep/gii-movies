
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | GII MOVIES</title>
    <link rel="stylesheet" href="../css/style.css">

    <script>
        const token = sessionStorage.getItem("adminToken");

        if (!token) {
            window.location.href = "login.html";
        }
    </script>

    <style>
        body {
            min-height: 100vh;
        }

        .admin-header {
            padding: 22px 5%;
            background: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h2 {
            color: #e50914;
        }

        .dashboard {
            padding: 35px 5%;
        }

        .dashboard h1 {
            margin-bottom: 25px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: #191919;
            border: 1px solid #333;
            padding: 25px;
            border-radius: 10px;
        }

        .stat-card h3 {
            color: #aaa;
            margin-bottom: 15px;
        }

        .stat-card strong {
            font-size: 32px;
            color: #e50914;
        }

        .admin-actions {
            margin-top: 35px;
            background: #191919;
            padding: 25px;
            border-radius: 10px;
        }

        .admin-actions a {
            display: inline-block;
            background: #e50914;
            color: white;
            text-decoration: none;
            padding: 13px 20px;
            border-radius: 5px;
            margin: 10px 10px 0 0;
        }

        .admin-actions a:hover {
            background: #b00610;
        }

        .logout-btn {
            background: #e50914;
            color: white;
            padding: 10px 18px;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
        }

        #statsMessage {
            margin-top: 15px;
            color: #aaa;
        }
    </style>
</head>

<body>

<header class="admin-header">
    <h2>GII MOVIES ADMIN</h2>

    <button class="logout-btn" onclick="logoutAdmin()">
        Logout
    </button>
</header>

<main class="dashboard">

    <h1>Admin Dashboard</h1>

    <div class="stats">

        <div class="stat-card">
            <h3>Total Movies</h3>
            <strong id="totalMovies">0</strong>
        </div>

        <div class="stat-card">
            <h3>Total Users</h3>
            <strong id="totalUsers">0</strong>
        </div>

        <div class="stat-card">
            <h3>Categories</h3>
            <strong id="totalCategories">0</strong>
        </div>

    </div>

    <p id="statsMessage">Loading dashboard statistics...</p>

    <div class="admin-actions">

        <h2>Manage Website</h2>

        <a href="add-movie.html">+ Add Movie</a>

        <a href="manage-movies.html">Manage Movies</a>

        <a href="users.html">Manage Users</a>

        <a href="../movies.html">View Movies</a>

        <a href="../index.html">View Homepage</a>

    </div>

</main>

<footer>
    <p>© 2026 GII MOVIES Admin Panel</p>
</footer>

<script>
    const API_URL = "https://agasobanuyerwanda.loexmegh.workers.dev";

    async function loadDashboardStats() {
        const message = document.getElementById("statsMessage");

        try {
            const headers = {
                "Authorization": "Bearer " + token
            };

            const [moviesResponse, usersResponse, categoriesResponse] =
                await Promise.all([
                    fetch(API_URL + "/api/movies"),
                    fetch(API_URL + "/api/users", { headers }),
                    fetch(API_URL + "/api/categories")
                ]);

            const moviesData = await moviesResponse.json();
            const usersData = await usersResponse.json();
            const categoriesData = await categoriesResponse.json();

            if (!moviesResponse.ok || !moviesData.success) {
                throw new Error("Could not load movies.");
            }

            if (!usersResponse.ok || !usersData.success) {
                throw new Error(usersData.message || "Could not load users.");
            }

            if (!categoriesResponse.ok || !categoriesData.success) {
                throw new Error("Could not load categories.");
            }

            document.getElementById("totalMovies").textContent =
                moviesData.movies.length;

            document.getElementById("totalUsers").textContent =
                usersData.users.filter(user => user.role_name === "User").length;

            document.getElementById("totalCategories").textContent =
                categoriesData.categories.length;

            message.textContent = "Dashboard statistics updated successfully.";

        } catch (error) {
            message.textContent = error.message;
            console.error("Dashboard error:", error);
        }
    }

    function logoutAdmin() {
        sessionStorage.removeItem("adminToken");
        window.location.href = "login.html";
    }

    loadDashboardStats();
</script>

</body>
</html>
