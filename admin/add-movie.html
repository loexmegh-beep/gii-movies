
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Movie | GII MOVIES</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .form-container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: #191919;
            border-radius: 10px;
        }

        .form-container label {
            display: block;
            margin: 15px 0 8px;
        }

        .form-container input,
        .form-container textarea,
        .form-container select {
            width: 100%;
            padding: 13px;
            background: #292929;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .form-container textarea {
            min-height: 110px;
        }

        .form-container button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            background: #e50914;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #e50914;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">GII MOVIES ADMIN</div>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="../index.html">Website</a>
    </nav>
</header>

<div class="form-container">

    <h1>Add New Movie</h1>

    <form id="movieForm">

        <label for="title">Movie Title</label>
        <input type="text" id="title" required>

        <label for="category">Category</label>
        <select id="category" required>
            <option value="">Loading categories...</option>
        </select>

        <label for="year">Release Year</label>
        <input type="number" id="year" min="1900" max="2100" required>

        <label for="poster">Poster Image URL</label>
        <input type="url" id="poster" placeholder="https://example.com/poster.jpg">

        <label for="video">Video URL (Optional)</label>
        <input type="url" id="video" placeholder="https://example.com/movie.mp4">

        <label for="description">Movie Description</label>
        <textarea id="description" required></textarea>

        <button type="submit" id="saveButton">SAVE MOVIE</button>

    </form>

    <p id="message"></p>

    <a class="back" href="index.html">← Back to Dashboard</a>

</div>

<script>
     
     
const API_URL = "https://agasobanuyerwanda.loexmegh.workers.dev";
const token = sessionStorage.getItem("adminToken");

if (!token) {
    window.location.href = "login.html";
}

// LOAD CATEGORIES
async function loadCategories() {
    const select = document.getElementById("category");

    try {
        const response = await fetch(API_URL + "/api/categories");
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error("Unable to load categories.");
        }

        select.innerHTML = '<option value="">Select category</option>';

        data.categories.forEach(category => {
            const option = document.createElement("option");

            option.value = category.category_id;
            option.textContent = category.category_name;

            select.appendChild(option);
        });

    } catch (error) {
        select.innerHTML = '<option value="">Categories unavailable</option>';
        document.getElementById("message").textContent = error.message;
    }
}

loadCategories();

// ADD MOVIE
document.getElementById("movieForm").addEventListener("submit",
async function(event) {

    event.preventDefault();

    const message = document.getElementById("message");
    const button = document.getElementById("saveButton");

    const movie = {
        title: document.getElementById("title").value.trim(),
        category_id: Number(document.getElementById("category").value),
        release_year: Number(document.getElementById("year").value),
        poster_url: document.getElementById("poster").value.trim(),
        video_url: document.getElementById("video").value.trim(),
        description: document.getElementById("description").value.trim()
    };

    if (!movie.title || !movie.category_id || !movie.release_year) {
        message.style.color = "red";
        message.textContent = "Please complete all required fields.";
        return;
    }

    if (movie.release_year < 1900 || movie.release_year > 2100) {
        message.style.color = "red";
        message.textContent = "Enter a valid release year.";
        return;
    }

    button.disabled = true;
    button.textContent = "SAVING...";

    try {
        const response = await fetch(API_URL + "/api/movies", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify(movie)
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Failed to save movie.");
        }

        message.style.color = "#00cc66";
        message.textContent = "Movie added successfully! Movie ID: " + data.movie_id;

        this.reset();

    } catch (error) {
        message.style.color = "#ff5555";
        message.textContent = error.message;

    } finally {
        button.disabled = false;
        button.textContent = "SAVE MOVIE";
    }
});
</script>
</body>
</html>
