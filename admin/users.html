
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Management - GII MOVIES</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #101010;
            color: white;
            padding: 30px;
        }

        h1 {
            color: #e50914;
            margin-bottom: 10px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        a {
            color: white;
            text-decoration: none;
            background: #333;
            padding: 10px 15px;
            border-radius: 5px;
        }

        .table-box {
            overflow-x: auto;
            background: #1c1c1c;
            padding: 20px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #444;
            text-align: left;
        }

        th {
            color: #e50914;
        }

        .delete-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .message {
            margin: 15px 0;
            color: #ddd;
        }

        .role {
            color: #00d084;
        }
    </style>
</head>

<body>

    <div class="top">
        <div>
            <h1>Users Management</h1>
            <p>Manage registered GII MOVIES users</p>
        </div>

        <a href="index.html">← Back to Dashboard</a>
    </div>

    <p id="message" class="message">Loading users...</p>

    <div class="table-box">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Created At</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="usersTable"></tbody>
        </table>
    </div>

    <script>
        const API_URL = "https://agasobanuyerwanda.loexmegh.workers.dev";
        const token = sessionStorage.getItem("adminToken");

        const message = document.getElementById("message");
        const usersTable = document.getElementById("usersTable");

        if (!token) {
            window.location.href = "login.html";
        } else {
            loadUsers();
        }

        async function loadUsers() {
            try {
                const response = await fetch(API_URL + "/api/users", {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Failed to load users");
                }

                usersTable.innerHTML = "";
                message.textContent = data.users.length + " registered users";

                if (data.users.length === 0) {
                    message.textContent = "No users found.";
                    return;
                }

                data.users.forEach(user => {
                    const row = document.createElement("tr");

                    const values = [
                        user.user_id,
                        user.full_name,
                        user.email,
                        user.role_name,
                        user.created_at
                    ];

                    values.forEach(value => {
                        const cell = document.createElement("td");
                        cell.textContent = value ?? "";
                        row.appendChild(cell);
                    });

                    const actionCell = document.createElement("td");

                    if (user.role_name === "User") {
                        const deleteButton = document.createElement("button");
                        deleteButton.textContent = "Delete";
                        deleteButton.className = "delete-btn";

                        deleteButton.onclick = () => deleteUser(user.user_id);

                        actionCell.appendChild(deleteButton);
                    } else {
                        actionCell.textContent = "Protected";
                        actionCell.className = "role";
                    }

                    row.appendChild(actionCell);
                    usersTable.appendChild(row);
                });

            } catch (error) {
                message.textContent = error.message;
            }
        }

        async function deleteUser(userId) {
            if (!confirm("Are you sure you want to delete this user?")) {
                return;
            }

            try {
                const response = await fetch(API_URL + "/api/users/" + userId, {
                    method: "DELETE",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Unable to delete user");
                }

                alert("User deleted successfully!");
                loadUsers();

            } catch (error) {
                alert(error.message);
            }
        }
    </script>

</body>
</html>
