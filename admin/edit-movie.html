
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Movie - GII MOVIES</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 25px;
            background: #080d18;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background: #121d30;
            border-radius: 12px;
        }
        h1 { color: #00d4ff; }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px;
            border: 1px solid #354761;
            border-radius: 6px;
            background: #080d18;
            color: white;
        }
        button {
            padding: 13px 20px;
            background: #00c8ed;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        a { color: #00d4ff; }
        #message { margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>EDIT MOVIE</h1>
    <p><a href="manage-movies.html">← Back to Manage Movies</a></p>

    <form id="editForm">
        <label>Movie Title</label>
        <input type="text" id="title" required>

        <label>Category</label>
        <select id="category" required>
            <option value="">Loading categories...</option>
        </select>

        <label>Release Year</label>
        <input type="number" id="year" min="1900" max="2100" required>

        <label>Poster URL</label>
        <input type="url" id="poster">

        <label>Video URL</label>
        <input type="url" id="video">

        <label>Description</label>
        <textarea id="description" rows="5"></textarea>

        <button type="submit" id="saveButton">UPDATE MOVIE</button>
    </form>

    <p id="message"></p>
</div>

<script>
const API_URL = "https://agasobanuyerwanda.loexmegh.workers.dev";
const token = sessionStorage.getItem("adminToken");
const movieId = new URLSearchParams(window.location.search).get("id");

const message = document.getElementById("message");
const button = document.getElementById("saveButton");

if (!token) {
    window.location.href = "login.html";
}

if (!movieId || !/^\d+$/.test(movieId)) {
    message.textContent = "Invalid Movie ID.";
    button.disabled = true;
}

async function loadMovie() {
    try {
        const [movieResponse, categoryResponse] = await Promise.all([
            fetch(API_URL + "/api/movies"),
            fetch(API_URL + "/api/categories")
        ]);

        const movieData = await movieResponse.json();
        const categoryData = await categoryResponse.json();

        if (!movieResponse.ok || !movieData.success) {
            throw new Error("Failed to load movies.");
        }

        if (!categoryResponse.ok || !categoryData.success) {
            throw new Error("Failed to load categories.");
        }

        const movie = (movieData.movies || []).find(
            item => String(item.movie_id) === String(movieId)
        );

        if (!movie) throw new Error("Movie not found.");

        const select = document.getElementById("category");
        select.innerHTML = '<option value="">Select category</option>';

        categoryData.categories.forEach(category => {
            const option = document.createElement("option");
            option.value = category.category_id;
            option.textContent = category.category_name;
            select.appendChild(option);
        });

        document.getElementById("title").value = movie.title || "";
        select.value = movie.category_id || "";
        document.getElementById("year").value = movie.release_year || "";
        document.getElementById("poster").value = movie.poster_url || "";
        document.getElementById("video").value = movie.video_url || "";
        document.getElementById("description").value = movie.description || "";

        message.textContent = "Movie loaded successfully.";

    } catch (error) {
        message.textContent = error.message;
    }
}

document.getElementById("editForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const movie = {
        title: document.getElementById("title").value.trim(),
        category_id: Number(document.getElementById("category").value),
        release_year: Number(document.getElementById("year").value),
        poster_url: document.getElementById("poster").value.trim(),
        video_url: document.getElementById("video").value.trim(),
        description: document.getElementById("description").value.trim()
    };

    if (!movie.title || !movie.category_id || !movie.release_year) {
        message.textContent = "Complete all required fields.";
        return;
    }

    button.disabled = true;
    button.textContent = "UPDATING...";

    try {
        const response = await fetch(API_URL + "/api/movies/" + movieId, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify(movie)
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Update failed.");
        }

        message.textContent = "Movie updated successfully!";

    } catch (error) {
        message.textContent = error.message;
    } finally {
        button.disabled = false;
        button.textContent = "UPDATE MOVIE";
    }
});

if (movieId && /^\d+$/.test(movieId)) {
    loadMovie();
}
</script>

</body>
</html>
