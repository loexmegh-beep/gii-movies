
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GII MOVIES</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            margin: 65px auto;
            padding: 35px;
            background: #171717;
            border-radius: 10px;
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-container input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            background: #292929;
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
        }

        .login-container button {
            width: 100%;
            padding: 14px;
            background: #e50914;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
        }

        .login-container p {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        .login-container a {
            color: #e50914;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">GII MOVIES</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
    </nav>
</header>

<div class="login-container">
    <h1>Welcome Back</h1>

    <form onsubmit="loginUser(event)">
        <input type="email" id="email" placeholder="Email Address" required>

        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">LOGIN</button>
    </form>

    <p>Don't have an account?
        <a href="register.html">Sign Up</a>
    </p>
</div>

<footer>
    <p>© 2026 GII MOVIES. All Rights Reserved.</p>
</footer>

<script>

async function loginUser(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        const response = await fetch(
            "https://agasobanuyerwanda.loexmegh.workers.dev/api/user/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            alert(data.message || "Login failed");
            return;
        }

        localStorage.setItem("userToken", data.token);
        localStorage.setItem("loggedInUser", JSON.stringify(data.user));

        alert("Welcome " + data.user.full_name + "!");

        window.location.href = "movies.html";

    } catch (error) {
        alert("Unable to connect to server. Try again.");
        console.error(error);
    }
}

</script>

</body>
</html>
