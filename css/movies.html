
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Movies | GII MOVIES</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .page-title {
            padding: 40px 6% 10px;
        }

        .category {
            margin: 20px 6%;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .category button {
            background: #222;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
        }

        .category button:hover {
            background: #e50914;
        }

        .movie-card img {
            height: 250px;
            width: 100%;
            object-fit: cover;
        }

        .movie-link {
            display: block;
            text-decoration: none;
            color: white;
        }

        #moviesContainer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        #loadingMessage {
            padding: 20px;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">GII MOVIES</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="login.html">Login</a>
        <a href="register.html">Sign Up</a>
    </nav>
</header>

<h1 class="page-title">Explore All Movies</h1>

<div class="category" id="categoryFilters">
    <button onclick="filterCategory('all')">All</button>
</div>

<section class="content">

    <input
        type="text"
        id="searchInput"
        class="search"
        placeholder="Search movies..."
        onkeyup="searchMovies()"
    >

    <p id="loadingMessage">Loading movies...</p>

    <div class="movies" id="moviesContainer"></div>

</section>

<footer>
    <p>© 2026 GII MOVIES. All Rights Reserved.</p>
</footer>

<script src="js/main.js"></script>

</body>
</html>
