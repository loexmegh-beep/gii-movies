
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details | GII MOVIES</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .details {
            padding: 60px 7%;
            min-height: 75vh;
            display: flex;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .details img {
            width: 280px;
            max-width: 100%;
            height: 390px;
            object-fit: cover;
            border-radius: 10px;
        }

        .info {
            max-width: 550px;
        }

        .info h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .info p {
            color: #ccc;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .meta {
            color: #e50914;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">GII MOVIES</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<section class="details">

    <img id="poster" src="" alt="Movie poster">

    <div class="info">
        <h1 id="title">Loading movie...</h1>

        <div class="meta" id="meta"></div>

        <p id="description"></p>

        <a id="watchButton" href="#" class="btn">
            ▶ WATCH NOW
        </a>

        <br><br>

        <a href="movies.html">← Back to Movies</a>
    </div>

</section>

<footer>
    <p>© 2026 GII MOVIES. All Rights Reserved.</p>
</footer>

<script>
const API_URL = "https://agasobanuyerwanda.loexmegh.workers.dev";

async function loadMovie() {

    const params = new URLSearchParams(window.location.search);
    const movieId = params.get("id");

    if (!movieId) {
        showError("Movie ID not found.");
        return;
    }

    try {

        const response = await fetch(API_URL + "/api/movies");
        const data = await response.json();

        const movie = data.movies.find(item =>
            String(item.movie_id) === movieId
        );

        if (!movie) {
            showError("Movie not found.");
            return;
        }

        document.getElementById("title").textContent = movie.title;

        document.getElementById("meta").textContent =
            (movie.category_name || "Movie") + " • " +
            (movie.release_year || "");

        document.getElementById("poster").src =
            movie.poster_url || "https://placehold.co/400x500?text=GII+MOVIES";

        document.getElementById("description").textContent =
            movie.description || "No description available.";

        document.getElementById("watchButton").href =
            "watch.html?id=" + movie.movie_id;

    } catch (error) {

        console.error(error);
        showError("Unable to load movie. Please try again.");

    }
}

function showError(message) {

    document.getElementById("title").textContent = message;
    document.getElementById("description").textContent =
        "Please return to the movies page and try again.";

    document.getElementById("poster").style.display = "none";
    document.getElementById("watchButton").style.display = "none";
}

loadMovie();
</script>

</body>
</html>
