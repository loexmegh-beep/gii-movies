
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Details | GII MOVIES</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}
body {
    background: #080d18;
    color: white;
}
header {
    padding: 20px 5%;
    background: #111827;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.logo {
    color: #00d4ff;
    font-size: 25px;
    font-weight: bold;
}
header a {
    color: white;
    text-decoration: none;
}
.hero {
    padding: 45px 5%;
    display: flex;
    gap: 35px;
    align-items: center;
    flex-wrap: wrap;
}
.poster {
    width: 280px;
    max-width: 100%;
    height: 390px;
    object-fit: cover;
    border-radius: 12px;
    background: #182438;
}
.info {
    flex: 1;
    min-width: 250px;
}
.info h1 {
    color: #00d4ff;
    font-size: 36px;
    margin-bottom: 15px;
}
.meta {
    color: #aebbd0;
    margin-bottom: 20px;
}
.description {
    line-height: 1.8;
    color: #d4dce8;
    max-width: 650px;
    margin-bottom: 25px;
}
.watch {
    display: inline-block;
    padding: 14px 28px;
    background: #00c8ed;
    color: #00121b;
    text-decoration: none;
    font-weight: bold;
    border-radius: 7px;
}
.related {
    padding: 20px 5% 50px;
}
.related h2 {
    margin-bottom: 20px;
}
.movies {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 18px;
}
.movie-card {
    background: #121d30;
    border-radius: 9px;
    overflow: hidden;
    cursor: pointer;
}
.movie-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}
.movie-card h3 {
    padding: 12px;
    font-size: 15px;
}
#message {
    padding: 30px 5%;
    color: #00d4ff;
}
@media(max-width: 600px) {
    .hero { padding-top: 25px; }
    .poster { width: 100%; height: 350px; }
    .info h1 { font-size: 28px; }
}
</style>
</head>

<body>

<header>
    <div class="logo">GII MOVIES</div>
    <a href="movies.html">← Back to Movies</a>
</header>

<p id="message">Loading movie details...</p>

<section class="hero" id="movieDetails" style="display:none">
    <img id="poster" class="poster" alt="Movie poster">

    <div class="info">
        <h1 id="title"></h1>
        <p class="meta" id="meta"></p>
        <p class="description" id="description"></p>

        <a id="watchButton"
           class="watch"
           href="#"
           target="_blank"
           rel="noopener"
           style="display:none">
            WATCH NOW
        </a>
    </div>
</section>

<section class="related">
    <h2>MORE MOVIES</h2>
    <div class="movies" id="relatedMovies"></div>
</section>

<script>
const API_URL = "https://agasobanuyerwanda.loexmegh.workers.dev";

const movieId = new URLSearchParams(
    window.location.search
).get("id");


// SAVE MOVIE TO WATCH HISTORY
async function saveWatchHistory(id) {

    const token = localStorage.getItem("userToken");

    // Guest users cannot save watch history
    if (!token) {
        return;
    }

    try {

        const response = await fetch(
            API_URL + "/api/watch-history",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },

                body: JSON.stringify({
                    movie_id: Number(id)
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            console.error(
                "Watch history error:",
                data.message
            );
        } else {
            console.log("Movie saved to Watch History!");
        }

    } catch (error) {
        console.error("Watch History Error:", error);
    }
}


// LOAD MOVIE DETAILS
async function loadMovie() {

    const message = document.getElementById("message");

    try {

        if (!movieId || !/^\d+$/.test(movieId)) {
            throw new Error("Invalid movie ID.");
        }

        const response = await fetch(
            API_URL + "/api/movies"
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error("Unable to load movies.");
        }

        const movies = data.movies || [];

        const movie = movies.find(item =>
            String(item.movie_id) === String(movieId)
        );

        if (!movie) {
            throw new Error("Movie not found.");
        }

        document.title = movie.title + " | GII MOVIES";

        document.getElementById("poster").src =
            movie.poster_url || "";

        document.getElementById("title").textContent =
            movie.title;

        document.getElementById("meta").textContent =
            (movie.category_name || "Movie") +
            " | " +
            (movie.release_year || "Year unavailable");

        document.getElementById("description").textContent =
            movie.description || "No description available.";

        const watchButton =
            document.getElementById("watchButton");

        if (movie.video_url) {

            watchButton.href = movie.video_url;

            watchButton.style.display = "inline-block";

            // SAVE WATCH HISTORY WHEN USER CLICKS WATCH NOW
            watchButton.addEventListener("click", function() {

                saveWatchHistory(movie.movie_id);

            });
        }

        document.getElementById("movieDetails").style.display =
            "flex";

        message.textContent = "";


        // MORE MOVIES
        const related = movies.filter(item =>
            String(item.movie_id) !== String(movieId)
        );

        const container =
            document.getElementById("relatedMovies");

        container.innerHTML = "";

        related.forEach(item => {

            const card = document.createElement("div");

            card.className = "movie-card";

            const img = document.createElement("img");

            img.src = item.poster_url || "";

            img.alt = item.title;

            const heading = document.createElement("h3");

            heading.textContent = item.title;

            card.append(img, heading);

            card.onclick = () => {

                window.location.href =
                    "details.html?id=" + item.movie_id;

            };

            container.appendChild(card);

        });

    } catch (error) {

        message.textContent = error.message;

    }
}

loadMovie();
</script>

</body>
</html>
