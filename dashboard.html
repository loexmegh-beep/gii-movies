
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | GII MOVIES</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}
body {
    background: #080d18;
    color: white;
}
header {
    background: #111c2e;
    padding: 20px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.logo {
    color: #00d4ff;
    font-size: 24px;
    font-weight: bold;
}
header a {
    color: white;
    text-decoration: none;
}
.container {
    max-width: 650px;
    margin: 50px auto;
    padding: 25px;
}
.profile {
    background: #121d30;
    border: 1px solid #26364f;
    border-radius: 12px;
    padding: 30px;
}
.avatar {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    background: #00c8ed;
    color: #00121b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
    font-weight: bold;
    margin-bottom: 20px;
}
h1 {
    color: #00d4ff;
    margin-bottom: 25px;
}
.info {
    padding: 15px 0;
    border-bottom: 1px solid #354761;
}
.info label {
    display: block;
    color: #aebbd0;
    margin-bottom: 8px;
}
.info p {
    font-size: 17px;
}
.buttons {
    display: flex;
    gap: 12px;
    margin-top: 25px;
    flex-wrap: wrap;
}
button, .movies-link {
    padding: 12px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    font-weight: bold;
}
.movies-link {
    background: #00c8ed;
    color: #00121b;
}
.logout {
    background: #e63946;
    color: white;
}
#message {
    color: #00d4ff;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<header>
    <div class="logo">GII MOVIES</div>
    <a href="index.html">HOME</a>
</header>

<div class="container">
    <p id="message">Loading your profile...</p>

    <div class="profile">
        <div class="avatar" id="avatar">U</div>

        <h1>MY PROFILE</h1>

        <div class="info">
            <label>Full Name</label>
            <p id="fullName">Loading...</p>
        </div>

        <div class="info">
            <label>Email Address</label>
            <p id="email">Loading...</p>
        </div>

        <div class="info">
            <label>Account Role</label>
            <p id="role">Loading...</p>
        </div>

        <div class="buttons">
            <a href="movies.html" class="movies-link">BROWSE MOVIES</a>
            <button class="logout" onclick="logout()">LOGOUT</button>
        </div>
    </div>
</div>

<script>
const API_URL = "https://agasobanuyerwanda.loexmegh.workers.dev";
const token = localStorage.getItem("userToken");

if (!token) {
    window.location.href = "login.html";
}

async function loadProfile() {
    const message = document.getElementById("message");

    try {
        const response = await fetch(API_URL + "/api/user/me", {
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to load profile.");
        }

        const user = data.user;

        document.getElementById("fullName").textContent =
            user.full_name || "Not available";

        document.getElementById("email").textContent =
            user.email || "Not available";

        document.getElementById("role").textContent =
            user.role_name || user.role || "User";

        document.getElementById("avatar").textContent =
            (user.full_name || "U").charAt(0).toUpperCase();

        localStorage.setItem("loggedInUser", JSON.stringify(user));

        message.textContent = "Profile loaded successfully!";

    } catch (error) {
        message.textContent = error.message;
    }
}

function logout() {
    if (confirm("Are you sure you want to logout?")) {
        localStorage.removeItem("userToken");
        localStorage.removeItem("loggedInUser");
        window.location.href = "login.html";
    }
}

if (token) {
    loadProfile();
}
</script>

</body>
</html>
